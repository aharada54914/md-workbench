name: MDW benchmark tooling
on:
  pull_request:
    paths:
      - 'scripts/benchmark/**'
      - 'docs/md-workbench/benchmark/**'
      - '.github/workflows/mdw-benchmark.yml'
permissions:
  contents: read
jobs:
  measurement-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python -m pip install -r scripts/benchmark/requirements.txt
      - name: Sampler, CLI, failure preservation and statistical contracts
        run: python scripts/benchmark/test_measure.py
