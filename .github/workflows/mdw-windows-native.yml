name: MDW Windows native reproduction
on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/benchmark/windows_native.mjs'
      - 'scripts/benchmark/native_authority.mjs'
      - 'scripts/benchmark/native_open_queue.mjs'
      - 'scripts/benchmark/native_open_queue.test.mjs'
      - 'scripts/benchmark/windows_queue_state.ps1'
      - 'scripts/benchmark/native_preview_boundary.mjs'
      - 'scripts/benchmark/windows_ui.ps1'
      - 'scripts/benchmark/native_memory.py'
      - 'scripts/benchmark/windows_glyphs.py'
      - 'scripts/benchmark/test_windows_glyphs.py'
      - 'scripts/benchmark/native_summary.mjs'
      - 'scripts/benchmark/native_summary.test.mjs'
      - 'scripts/benchmark/measure.py'
      - '.github/workflows/mdw-windows-native.yml'
permissions:
  contents: read
jobs:
  build-windows-release:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.93.0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm install --global pnpm@11.3.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/benchmark/native_summary.test.mjs scripts/benchmark/native_open_queue.test.mjs
      - run: python -m pip install -r scripts/benchmark/requirements.txt
      - run: python -m unittest discover -s scripts/benchmark -p test_windows_glyphs.py
      - run: rustup toolchain install 1.93.0 --profile minimal --no-self-update
      - name: Build native release (not dev server or debug build)
        run: pnpm tauri build --no-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mdw-native-x64-release-${{ github.sha }}
          path: src-tauri/target/release/md-workbench.exe
          retention-days: 3
          if-no-files-found: error
  real-windows-webview:
    needs: build-windows-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          architecture: x64
      - run: npm install --global pnpm@11.3.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/benchmark/requirements.txt
      - run: python -m unittest discover -s scripts/benchmark -p test_windows_glyphs.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        id: native_binary
        with:
          name: mdw-native-x64-release-${{ github.sha }}
          path: native-binary
      - name: Native release document exercise (30 cold and 50 warm)
        if: matrix.os == 'windows-2022'
        run: node scripts/benchmark/windows_native.mjs native-binary/md-workbench.exe native-fork MD-Workbench
      - name: Native UI and exact Source save without debugger
        if: always() && steps.native_binary.outcome == 'success'
        run: powershell.exe -NoProfile -STA -File scripts/benchmark/windows_ui.ps1 -Binary native-binary/md-workbench.exe -Output native-ui-fork -VerifyEditor
      - name: Install pinned upstream on this same disposable machine
        if: always()
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'mdw-upstream-0.7.3.exe'
          Invoke-WebRequest 'https://github.com/Vesperino/MerMarkEditor/releases/download/v0.7.3/MerMark.Editor_0.7.3_x64-setup.exe' -OutFile $setup
          if ((Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant() -ne '0bb3755565b8dc5d07398effd25a296ae438f228c6aa664d0d966ee27bf89e26') { throw 'Upstream checksum mismatch' }
          $install = Join-Path $env:RUNNER_TEMP 'mdw-native-upstream'
          $proc = Start-Process $setup -ArgumentList @('/S', ('/D=' + $install)) -PassThru
          if (-not $proc.WaitForExit(120000) -or $proc.ExitCode -ne 0) { throw 'Upstream installer failed' }
          "MDW_UPSTREAM_EXE=$install\mdreader.exe" >> $env:GITHUB_ENV
      - name: Upstream document exercise with identical observation conditions
        if: always() && matrix.os == 'windows-2022' && env.MDW_UPSTREAM_EXE != ''
        run: node scripts/benchmark/windows_native.mjs "$env:MDW_UPSTREAM_EXE" native-upstream MerMark-0.7.3
      - name: Upstream native UI with identical viewing checks
        if: always() && env.MDW_UPSTREAM_EXE != ''
        run: powershell.exe -NoProfile -STA -File scripts/benchmark/windows_ui.ps1 -Binary "$env:MDW_UPSTREAM_EXE" -Output native-ui-upstream
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mdw-native-${{ matrix.os }}-${{ github.sha }}
          path: |
            native-fork/**
            native-upstream/**
            native-ui-fork/**
            native-ui-upstream/**
          retention-days: 14
          if-no-files-found: error
