# Temporary T01 evidence import. Removed after its immutable Git blob is attached by the connector.
name: MDW T01 preserve verified lock
on:
  pull_request:
    branches: [master]
    paths: ['.github/workflows/mdw-t01-preserve-lock.yml']
permissions: {}
jobs:
  preserve:
    if: github.repository == 'aharada54914/md-workbench' && github.event.pull_request.number == 35 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/t01-upstream-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download only the verified T01 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/aharada54914/md-workbench/actions/artifacts/10321126259/zip > evidence.zip
      - name: Check archive and lock hashes before importing
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          archive = pathlib.Path('evidence.zip').read_bytes()
          assert hashlib.sha256(archive).hexdigest() == '306013002f26340ec10cf0991086dbb8375711876f072ba3260c796c3509fd51'
          with zipfile.ZipFile('evidence.zip') as z:
              assert z.getinfo('Cargo.lock').file_size == 153245
              data = z.read('Cargo.lock')
          assert hashlib.sha256(data).hexdigest() == '55c44597a38aa33cbf7e1bc6e14df419cf16ac80e4efccce8986c2327b679439'
          pathlib.Path('blob.json').write_text(json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}), encoding='utf-8')
          print('Verified Git blob:', hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest())
          PY
      - name: Create immutable blob only (no refs, commits, release or secrets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/aharada54914/md-workbench/git/blobs --input blob.json --jq '.sha'
