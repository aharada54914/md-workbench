name: MDW source preservation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mdw-source-preservation.yml'
permissions:
  contents: read
jobs:
  source-roundtrip:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm install --global pnpm@11.3.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:run
      - run: pnpm build
      - run: pnpm exec playwright test
      # Tests use synthetic fixtures; retain only bounded failure diagnostics.
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mdw-source-preservation-browser-failure-${{ matrix.os }}
          path: |
            test-results/**/*.zip
            test-results/**/*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
