name: MDW Windows 11 runtime diagnosis
on:
  pull_request:
    paths: ['.github/workflows/mdw-windows11-diagnostic.yml', 'scripts/benchmark/windows_ui.ps1']
permissions:
  contents: read
  actions: read
jobs:
  inspect-owned-release:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 34793053160
          name: mdw-native-x64-release-b3ea081dcbedd39b66b976d1366faf37a3d29945
          path: native-binary
      - name: Native Windows UI and exact source save without debugger
        run: powershell.exe -NoProfile -STA -File scripts/benchmark/windows_ui.ps1 -Binary native-binary/md-workbench.exe -Output native-ui -VerifyEditor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mdw-win11-ui-diagnostic-${{ github.sha }}
          path: native-ui/**
          retention-days: 3
