name: MDW native storage API probe
on:
  pull_request:
    paths:
      - 'scripts/native-storage-probe/**'
      - 'src-tauri/src/resources/**'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/mdw-storage-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-api-support:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.93.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.93.0 --profile minimal --no-self-update
      - name: Validate the bounded observation schema
        run: cargo test --locked --manifest-path scripts/native-storage-probe/Cargo.toml
      - name: Observe real Windows flush and private ACL APIs
        shell: pwsh
        run: |
          $report = & cargo run --quiet --locked --manifest-path scripts/native-storage-probe/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Storage probe did not produce a valid report' }
          $json = ($report -join "`n") + "`n"
          $decoded = $json | ConvertFrom-Json
          if ($decoded.schema_version -ne 1 -or $decoded.scope -ne 'api_support_only' -or $decoded.platform -ne 'windows') {
            throw 'Unexpected storage probe report contract'
          }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'storage-api-probe.json'), $json, [System.Text.UTF8Encoding]::new($false))
          'This report measures flush API support and disposable owner/DACL controls. It does not establish renderer isolation, production private-root authority, or power-loss durability.' | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Verify ACL positive and negative controls
        shell: pwsh
        run: |
          $decoded = Get-Content storage-api-probe.json -Raw | ConvertFrom-Json
          $positive = @('query_process_identity', 'create_private_directory', 'inspect_private_directory', 'create_private_file', 'inspect_private_file', 'create_broad_acl_file', 'create_null_acl_file', 'create_unprotected_acl_file', 'create_junction', 'verify_acl_sentinel', 'cleanup_acl')
          foreach ($name in $positive) {
            $result = @($decoded.operations | Where-Object operation -eq $name)
            if ($result.Count -ne 1 -or $result[0].outcome.status -ne 'success') {
              throw "ACL positive control did not succeed: $name"
            }
          }
          $negative = @{
            reject_broad_acl_file = 'unexpected_acl'
            reject_null_acl_file = 'null_or_missing_dacl'
            reject_unprotected_acl_file = 'unprotected_dacl'
            reject_junction = 'unexpected_file_type'
          }
          foreach ($name in $negative.Keys) {
            $result = @($decoded.operations | Where-Object operation -eq $name)
            if ($result.Count -ne 1 -or $result[0].outcome.status -ne 'rejected' -or $result[0].outcome.reason -ne $negative[$name]) {
              throw "ACL negative control did not produce the expected rejection: $name"
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mdw-storage-api-${{ matrix.os }}-${{ github.sha }}
          path: storage-api-probe.json
          retention-days: 14
          if-no-files-found: error

  inactive-metadata-store:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.93.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.93.0 --profile minimal --no-self-update
      - name: Test the shared product primitive
        run: cargo test --locked --manifest-path scripts/native-storage-probe/Cargo.toml
      - name: Test explicit process-boundary diagnostic build
        run: cargo test --locked --manifest-path scripts/native-storage-probe/Cargo.toml --features private-store-probe
      - name: Exercise native bootstrap, append, flush and fresh process observation (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo run --quiet --locked --manifest-path scripts/native-storage-probe/Cargo.toml -- --metadata > metadata-store-probe.json
          echo 'Inactive metadata only. Namespace durability is unestablished and snapshots are unverified; this is not a power-loss or renderer-isolation certification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise native bootstrap, append, flush and fresh process observation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Invoke directly: an MSYS shell can enable backup/restore privileges.
          # The native primitive still rejects such tokens, with no fallback.
          $report = & cargo run --quiet --locked --manifest-path scripts/native-storage-probe/Cargo.toml -- --metadata
          $probeExit = $LASTEXITCODE
          [System.IO.File]::WriteAllText((Join-Path $PWD 'metadata-store-probe.json'), ($report -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          if ($probeExit -ne 0) { throw 'Inactive metadata probe failed; see typed report' }
          'Inactive metadata only. Namespace durability is unestablished and snapshots are unverified; this is not a power-loss or renderer-isolation certification.' | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Observe termination at fixed private-store boundaries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo run --quiet --locked --manifest-path scripts/native-storage-probe/Cargo.toml --features private-store-probe -- --metadata-kill > metadata-kill-probe.json
          echo 'Four owned child processes are terminated at explicit boundaries; four synthetic sessions remain on this disposable runner. Reopen stays metadata-only. Process kill does not simulate power loss.' >> "$GITHUB_STEP_SUMMARY"
      - name: Observe termination at fixed private-store boundaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = & cargo run --quiet --locked --manifest-path scripts/native-storage-probe/Cargo.toml --features private-store-probe -- --metadata-kill
          $probeExit = $LASTEXITCODE
          [System.IO.File]::WriteAllText((Join-Path $PWD 'metadata-kill-probe.json'), ($report -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          if ($probeExit -ne 0) { throw 'Process-boundary probe failed; see typed report' }
          'Four owned child processes are terminated at explicit boundaries; four synthetic sessions remain on this disposable runner. Reopen stays metadata-only. Process kill does not simulate power loss.' | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mdw-metadata-store-${{ matrix.os }}-${{ github.sha }}
          path: |
            metadata-store-probe.json
            metadata-kill-probe.json
          retention-days: 14
          if-no-files-found: error
