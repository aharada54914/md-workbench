name: MDW fixture integrity
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/mdw-fixtures.yml'
      - 'scripts/generate_mdw_fixtures.py'
      - 'scripts/test_mdw_fixtures.py'
      - 'docs/md-workbench/baseline/fixtures.lock.json'
permissions:
  contents: read
jobs:
  fixture-integrity:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python scripts/test_mdw_fixtures.py
