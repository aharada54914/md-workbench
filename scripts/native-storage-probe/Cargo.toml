[package]
name = "native-storage-probe"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
private-store-probe = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Ioctl"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
